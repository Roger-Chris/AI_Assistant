[project]
name = "brain"
version = "0.1.0"
description = "Always-on orchestrator for the personal assistant (CPU-only, no models run here)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pinned explicitly: ruff's defaults drift between releases and a lint run that changes
# meaning on its own is a lint run nobody reads
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]  # Depends(...) in a default is FastAPI's own idiom

[tool.setuptools.packages.find]
include = ["app*"]
